# This workflow installs the latest version of Terraform CLI and configures the Terraform CLI configuration file
# with an API token for Terraform Cloud (app.terraform.io). On pull request events, this workflow will run
# `terraform init`, `terraform fmt`, and `terraform plan` (speculative plan via Terraform Cloud). On push events
# to the "main" branch, `terraform apply` will be executed.
#
# Documentation for `hashicorp/setup-terraform` is located here: https://github.com/hashicorp/setup-terraform
#
# To use this workflow, you will need to complete the following setup steps.
#

name: 'Terraform Plan and Apply'

on:
  workflow_call:
    inputs:
      environment:
        required: false
        type: string
        default : 'stage'
      apply:
        required: true
        type: boolean
        default: false
    secrets:
      # Secrets used in the workflow. 
      # Do not delete these secrets. 
      # They are provided for a client workflow to override the default secret names
      # For P&I consumer workflows use secrets: inherit
      SUBSCRIPTION_ID:  # SMG Terraform Service Principal Application Client Secret
        required: true
      TERRAFORM_GH_TOKEN:
        required: false
      TERRAFORM_CLIENT_ID:
        required: false
      TERRAFORM_CLIENT_SECRET:
        required: false
      TERRAFORM_TENANT_ID:
        required: false


permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
    env:
      default-branch: ${{ github.event.repository.default_branch }}
      ARM_CLIENT_ID: ${{ secrets.TERRAFORM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.TERRAFORM_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.TERRAFORM_TENANT_ID }}
      TF_VAR_github_token: ${{secrets.TERRAFORM_GH_TOKEN}}
      TF_VAR_client_id: ${{ secrets.TERRAFORM_CLIENT_ID }}
      TF_VAR_client_secret: ${{ secrets.TERRAFORM_CLIENT_SECRET }}
      TF_VAR_tenant_id: ${{ secrets.TERRAFORM_TENANT_ID }}

    # Use the Bash shell regardless whether the GitHub Actions runner is ubuntu-latest, macos-latest, or windows-latest
    defaults:
      run:
        shell: bash

    steps:
    # Checkout the repository to the GitHub Actions runner
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Print Secrets
      run: |
        echo "CLIENT_ID: ${{ secrets.TERRAFORM_CLIENT_ID }}"
        echo "CLIENT_SECRET: ${{ secrets.TERRAFORM_CLIENT_SECRET }}"
        echo "SUBSCRIPTION_ID: ${{ secrets.SUBSCRIPTION_ID }}"
        echo "TENANT_ID: ${{ secrets.TERRAFORM_TENANT_ID }}"
    
    - name: Construct AZURE_CREDENTIALS
      run: |
        AZURE_CREDENTIALS_JSON=$(printf '{"clientId":"%s","clientSecret":"%s","subscriptionId":"%s","tenantId":"%s"}' "${{ secrets.TERRAFORM_CLIENT_ID }}" "${{ secrets.TERRAFORM_CLIENT_SECRET }}" "${{ secrets.SUBSCRIPTION_ID }}" "${{ secrets.TERRAFORM_TENANT_ID }}")
        echo "AZURE_CREDENTIALS_JSON=$AZURE_CREDENTIALS_JSON" >> $GITHUB_ENV
        echo "Constructed AZURE_CREDENTIALS_JSON: $AZURE_CREDENTIALS_JSON"
      
    # Azure Login with Service Principal
    - name: Set Up Azure CLI
      uses: azure/login@v2
      with:
        creds: ${{ env.AZURE_CREDENTIALS_JSON }}
        auth-type: SERVICE_PRINCIPAL

    # Install the latest version of Terraform CLI and configure the Terraform CLI configuration file with a Terraform Cloud user API token
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.7.5
        terraform_wrapper: false

    # Check and Print Terraform Version.
    - name: Terraform Version
      id: version
      run: terraform --version

    # Initialize a new or existing Terraform working directory by creating initial files, loading any remote state, downloading modules, etc.
    - name: Terraform Init
      id: init
      run: terraform init -backend-config=config/${{ inputs.environment }}_backend.tfvars -reconfigure -upgrade
      working-directory: terraform
    
    # Checks that all Terraform configuration files adhere to a canonical format
    - name: Terraform Validate
      id: validate
      run: terraform validate -no-color
      working-directory: terraform

    # Generates an execution plan for Terraform
    - name: Terraform Plan
      id: plan
      run: terraform plan -var-file=config/${{ inputs.environment }}.tfvars -input=false
      working-directory: terraform

      # On push to "main or master or the default branch", build or change infrastructure according to Terraform configuration files
      # Note: It is recommended to set up a required "strict" status check in your repository for "Terraform Cloud". See the documentation on "strict" required status checks for more information: https://help.github.com/en/github/administering-a-repository/types-of-required-status-checks
      #github.ref == 'refs/heads/$default-branch' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    - name: Terraform Apply
      if: ${{inputs.apply}}  
      run: terraform apply -var-file=config/${{ inputs.environment }}.tfvars -auto-approve -input=false
      working-directory: terraform
      
